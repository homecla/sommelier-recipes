name: Recipe catalog / Catalogo ricette

on:
  pull_request:
    paths: ["recipes/**", "tools/**", "build-catalog.sh"]
  push:
    branches: [main]
    paths: ["recipes/**", "tools/**", "build-catalog.sh"]

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valida le ricette
        run: ./build-catalog.sh --check

      - name: Rigenera catalog.json
        if: github.event_name == 'push'
        run: |
          ./build-catalog.sh
          if ! git diff --quiet catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog.json
            git commit -m "Aggiorna catalog.json"
            git push
          fi
